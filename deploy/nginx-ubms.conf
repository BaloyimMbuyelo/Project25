# UBMS site for Nginx (System Design 4.3.3). setup-server.sh copies this to
# /etc/nginx/sites-available/ubms and replaces __DOMAIN__ and __APP_DIR__.
# Certbot then adds the HTTPS (443) server block and the HTTP -> HTTPS
# redirect to the installed copy.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # React build (npm run build)
    root __APP_DIR__/frontend/dist;
    index index.html;

    # Menu photos are max 1 MB; leave some room for the multipart wrapper
    client_max_body_size 2m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API -> Node (PM2) on localhost only. The firewall blocks port 5000.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded menu photos, served straight from disk
    location /uploads/ {
        alias __UPLOAD_DIR__/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Vite puts hashed files in /assets, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: unknown paths load the app, which shows the right page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
